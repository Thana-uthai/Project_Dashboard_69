<title>AI-OS ทีมกลไก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root {
  --bg:#F7F6F3; --surface:#FFFFFF; --border:#E0DDD6; --text:#1A1A1A; --t2:#5A5A5A; --t3:#9A9890;
  --ink:#1A1A1A; --ink-fg:#FFFFFF; --focus:#1A5FA8;
  --ok:#1A7A56; --okbg:#E1F0E8; --warn:#8A5A00; --warnbg:#FAEFD2; --bad:#A8221A; --badbg:#F8E1DE; --mutebg:#ECEAE4;
  --a0:#1A7A56; --a1:#1A5FA8; --a2:#B05000; --a3:#7C5BBF; --a4:#A8221A; --a5:#1A7A8A;
  --r:14px; --rs:10px;
  --sans:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#151513; --surface:#1E1E1B; --border:#35342F; --text:#EEECE7; --t2:#B4B1A8; --t3:#7F7C74;
    --ink:#EEECE7; --ink-fg:#151513; --focus:#7DB0F0;
    --ok:#5CC29A; --okbg:#17332A; --warn:#E5B75A; --warnbg:#35290F; --bad:#F08A80; --badbg:#3A1E1B; --mutebg:#2A2927;
    --a0:#4DB58A; --a1:#6AA3E6; --a2:#E08A4A; --a3:#A58BE0; --a4:#E26B60; --a5:#4DB6C6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#151513; --surface:#1E1E1B; --border:#35342F; --text:#EEECE7; --t2:#B4B1A8; --t3:#7F7C74;
  --ink:#EEECE7; --ink-fg:#151513; --focus:#7DB0F0;
  --ok:#5CC29A; --okbg:#17332A; --warn:#E5B75A; --warnbg:#35290F; --bad:#F08A80; --badbg:#3A1E1B; --mutebg:#2A2927;
  --a0:#4DB58A; --a1:#6AA3E6; --a2:#E08A4A; --a3:#A58BE0; --a4:#E26B60; --a5:#4DB6C6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
#view:not(.wide) { max-width: 880px; margin: 0 auto; width: 100%; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.top h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.tag { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--warnbg); color: var(--warn); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--mutebg); border-radius: var(--r); overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 9px 14px; border-radius: var(--rs); color: var(--t2); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--border); }
.note { font-size: 13px; color: var(--t2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec-h h2 { font-size: 16px; font-weight: 600; }
.sec-h .count { font-family: var(--mono); font-size: 12.5px; color: var(--t2); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.grow { flex: 1 1 200px; min-width: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.empty { color: var(--t2); font-size: 14px; padding: 6px 0; }

.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: var(--rs); font-weight: 500; }
.btn:hover { border-color: var(--t3); }
.btn.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--t2); }
.btn[aria-pressed="true"] { background: var(--okbg); color: var(--ok); border-color: var(--ok); }
input[type=text], input[type=date], input[type=time], select, textarea { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: var(--rs); padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 84px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--t2); min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.chk { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--ok); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 1px 9px; border-radius: 999px; background: var(--mutebg); color: var(--t2); white-space: nowrap; }
.pill.ok { background: var(--okbg); color: var(--ok); } .pill.warn { background: var(--warnbg); color: var(--warn); } .pill.bad { background: var(--badbg); color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.tagp { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--mutebg); color: var(--text); max-width: 100%; overflow-wrap: anywhere; }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { border-top: 1px solid var(--border); padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
.task:first-child { border-top: 0; padding-top: 0; }
.task-line { display: flex; gap: 12px; align-items: flex-start; }
.done-btn { flex: none; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--t3); background: transparent; display: grid; place-items: center; padding: 0; color: transparent; font-size: 14px; line-height: 1; }
.done-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ttitle { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; font-size: 15.5px; }
.task.is-done .ttitle { text-decoration: line-through; color: var(--t2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.blocked { font-size: 13.5px; color: var(--bad); }
.tbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.editor { background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs); padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rs); padding: 10px 14px; }
.stat b { display: block; font-family: var(--mono); font-size: 24px; font-weight: 500; line-height: 1.2; }
.stat span { font-size: 13px; color: var(--t2); }
.stat.hot b { color: var(--bad); }
.pcard { border: 1px solid var(--border); border-radius: var(--rs); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pcard.stale { background: var(--bg); }
.pcard h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 2px 10px; font-size: 14px; margin: 0; }
.kv dt { color: var(--t2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.line-h { font-size: 13px; letter-spacing: .03em; color: var(--t2); font-weight: 500; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font-size: 14px; }
.chip button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 50%; color: var(--t2); line-height: 1; }

/* board */
.board { display: flex; flex-direction: column; gap: 14px; }
.bcol { display: contents; }
.bg { order: var(--o); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; min-width: 0; }
.bgh { color: var(--text); padding: 12px 14px; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column; gap: 8px; border-top: 4px solid var(--gc); border-bottom: 1px solid var(--border); }
.bgb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; min-width: 0; }
.bsec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bsh { display: flex; flex-direction: column; gap: 6px; color: var(--text); font-size: 15px; }
.bsel { width: 100%; font-size: 13.5px; padding: 5px 8px; }
.steps-l { list-style: none; margin: 0 0 0 6px; padding: 0 0 0 16px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.bs { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; position: relative; }
.bs::before { content: ""; position: absolute; left: -16px; top: .8em; width: 12px; border-top: 2px solid var(--border); }
.bs.done .bin { text-decoration: line-through; color: var(--t2); }
.bs.next .bin { font-weight: 600; }
.bchk { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--t3); background: var(--surface); color: transparent; font-size: 12px; line-height: 1; padding: 0; display: grid; place-items: center; }
.bchk[aria-pressed="true"] { background: var(--gc); border-color: var(--gc); color: #fff; }
.bnew { display: flex; gap: 6px; flex-wrap: wrap; }
.htools { display: flex; flex-wrap: wrap; gap: 6px; }
.hbtn { border: 1px solid var(--border); background: var(--bg); color: var(--t2); border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 500; }
.hbtn.warn { background: var(--badbg); color: var(--bad); border-color: var(--bad); }
.hbtn:disabled { opacity: .4; }

/* inline-editable text */
input.bin, textarea.bin { width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: 8px; color: inherit; font: inherit; }
input.bin:hover, textarea.bin:hover { border-color: var(--border); background: var(--surface); }
input.bin:focus, textarea.bin:focus { border-color: var(--focus); background: var(--surface); outline: none; }
input.bin.bgn { font-weight: 600; font-size: 16px; }
.bsh input.bin { font-size: 13.5px; color: var(--t2); }
.bs .bin { flex: 1 1 140px; min-width: 0; background: var(--bg); border-color: var(--border); }
textarea.bin { min-height: 0; resize: none; overflow: hidden; line-height: 1.5; display: block; }
.bs textarea.bin { background: var(--bg); border-color: var(--border); }

/* meetings */
.mc { gap: 10px; }
.mhead { display: flex; flex-direction: column; gap: 8px; }
.mbody { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mitem { border: 1px solid var(--border); border-radius: var(--rs); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.mitem.is-concl { border-color: var(--ok); }
.mrow1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mrow1 .mk { width: auto; min-width: 120px; }
.mitem textarea.bin { background: var(--surface); border-color: var(--border); }
.bnew select { width: auto; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ink-fg); padding: 10px 16px; border-radius: var(--rs); font-size: 14px; max-width: min(92vw, 520px); z-index: 20; }
.toast[hidden] { display: none; }
@media (min-width: 900px) {
  .board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr) minmax(0, 1fr); align-items: start; }
  .bcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .bg { order: 0; }
}
@media (max-width: 480px) { .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 4px; } }
@media (prefers-reduced-motion: no-preference) { .btn, .done-btn { transition: background-color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>AI-OS ทีมกลไก</h1>
    <span class="tag" id="sync">บันทึกในเครื่องนี้เท่านั้น</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="เมนูหลัก">
    <button role="tab" data-act="tab" data-tab="overview" id="tab-overview">ภาพรวม</button>
    <button role="tab" data-act="tab" data-tab="meet" id="tab-meet">ประชุม</button>
    <button role="tab" data-act="tab" data-tab="tasks" id="tab-tasks">งาน</button>
    <button role="tab" data-act="tab" data-tab="settings" id="tab-settings">ตั้งค่า</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var KEY = 'aios-webapp-trial-v1';
  var STATUS = { Inbox: 'จดไว้', Next: 'ทำต่อไป', Doing: 'กำลังทำ', Waiting: 'รอคนอื่น', Done: 'เสร็จแล้ว' };
  var RAG = { g: '🟢 ตามแผน', y: '🟡 ต้องจับตา', r: '🔴 ติดขัด', u: '⚪ ไม่ทราบ' };
  var MSTATUS = { plan: 'วางแผน', live: 'กำลังประชุม', done: 'เสร็จแล้ว' };
  var KINDS = ['ประเด็น', 'ข้อสรุป', 'งาน', 'เลื่อนนัด'];
  var MONEY = /บาท|฿|\d{1,3}(,\d{3})+/;

  /* ---------- helpers ---------- */
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function startOfToday() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function todayISO() { return iso(startOfToday()); }
  function plus(n) { var d = startOfToday(); d.setDate(d.getDate() + n); return iso(d); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function diff(s) { return Math.round((parse(s) - startOfToday()) / 864e5); }
  function fmt(s) { return s ? parse(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : ''; }
  function fmtY(s) { return s ? parse(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
  function nowStamp() { var d = new Date(); return todayISO() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function mi(kind, t) { return { id: uid(), kind: kind, t: t, linked: false }; }

  /* ---------- sample data (ตัวอย่างเท่านั้น) ---------- */
  function sampleBoard() {
    function G(name, line, col, c, secs) { return { id: uid(), name: name, line: line, col: col, c: c, sections: secs }; }
    function X(name, area, steps) { return { id: uid(), name: name, area: area, steps: steps.map(function (t) { return { id: uid(), t: t, done: false }; }) }; }
    var arch = 'ประสานทีมสถาปนิก เพื่อสำรวจพื้นที่ / ออกแบบ';
    return { asOf: '2026-10-20', groups: [
      G('บางยี่ขัน', 'AREA-BYK ย่านบางยี่ขัน', 0, 3, [X('', 'บางยี่ขัน', ['นัดนำเสนอกับแกนนำ (อีกครั้ง) เพื่อวางแผนการจัดกระบวนการมีส่วนร่วม', 'เข้าพบ ผอ.เขต เพื่อนำเสนอเบื้องต้น', 'จัดกระบวนการออกแบบอย่างมีส่วนร่วม', 'พัฒนาแบบ', 'คืนแบบ / วางแผนการดำเนินการ'])]),
      G('ปรับปรุงบ้านกลุ่มเปราะบาง', 'CUR-01 ปรับบ้านให้อยู่ดี', 1, 0, [
        X('ทต. หลักหก', 'หลักหก', [arch, 'นำเสนอผลการสำรวจกับเทศบาล', 'ออกแบบ', 'นำเสนอแบบกับเทศบาล']),
        X('ทม. ไร่ขิง', 'ไร่ขิง', [arch, 'คืนแบบ / วางแผนการดำเนินการ', 'นำเสนอผลกับเทศบาล', 'ขับเคลื่อนการสำรวจกลุ่มเปราะบางหมู่บ้านพฤกษา 5']),
        X('ทต.บางปู', 'บางปู', [arch, 'คืนแบบ / วางแผนการดำเนินการ', 'นำเสนอผลกับเทศบาล']),
        X('ทน. บางบัวทอง', 'บางบัวทอง', ['รอนัดหมายจากทีมร.ร.เนือยนิ่ง', 'ติดตามความเห็นของคุณนี เรื่องการปรึกษาการปรับปรุงบ้าน'])]),
      G('อยู่ดีตายดี', 'CUR-02 อยู่ดี ตายดี', 2, 5, [
        X('ทต. หนองเสือ', 'หนองเสือ', ['ประชุมประเมิน / วางแผนต่อเนื่อง']),
        X('ทน. บางบัวทอง / ทต. ทับมา', 'บางบัวทอง', ['ติดตามเพื่อสนับสนุน']),
        X('ทม.ไร่ขิง / ชุมชนตลาดหลักสี่', 'ไร่ขิง', ['(อาจ) ไม่มีการดำเนินการต่อ'])]),
      G('สื่อ', 'KM สตูและเผยแพร่', 0, 4, [X('', '', ['ทยอยผลิต Post: นำเสนอแนวคิดการปรับปรุงบ้านฯ', 'ทยอยผลิต Post: Post ที่มาโครงการ', 'คุยกับบรรณาธิการคู่มือโรงเรียนผู้สูงอายุ (โจ้)'])]),
      G('ส่วนกลาง', 'ส่วนกลาง', 2, 2, [X('', '', ['รายงาน: รายงานการทำงาน', 'รายงาน: ข้อมูลพื้นฐานของพื้นที่', 'การเงิน'])])
    ] };
  }
  function sample() {
    return {
      v: 3,
      owners: ['ผจก.', 'นักสังคม', 'สถาปนิก', 'การเงิน', 'ภาคี/ภายนอก'],
      lines: ['CUR-01 ปรับบ้านให้อยู่ดี', 'CUR-02 อยู่ดี ตายดี', 'AREA-BYK ย่านบางยี่ขัน', 'LEG-01 ไร่ขิงขยายผล', 'KM สตูและเผยแพร่', 'KNW-01 สังเคราะห์ความรู้', 'ส่วนกลาง'],
      areas: ['ไร่ขิง', 'หลักหก', 'บางบัวทอง', 'บางปู', 'บางยี่ขัน', 'หนองเสือ'],

      '<dl class="kv"><dt>ผลงาน</dt><dd>' + esc(p.result || '—') + '</dd><dt>ขั้นต่อไป</dt><dd>' + esc(p.next || '—') + (p.nextDate ? ' <span class="mono">(' + esc(fmt(p.nextDate)) + ')</span>' : '') + '</dd>' +
      '<dt>ข้อมูล ณ วันที่</dt><dd><span class="mono">' + esc(fmt(p.asOf)) + '</span> <span class="pill ' + fr.c + '">' + fr.l + ' · ' + fr.age + ' วันก่อน</span> <span class="pill">' + esc(p.conf) + '</span></dd></dl>' +
      (fr.stale ? '<p class="note">เก่ากว่า 14 วัน ระบบถือว่า "ไม่ทราบ" ไม่ใช่ "ตามแผน" ควรเอาเข้าวาระประชุมเพื่อยืนยันข้อมูลใหม่</p>' : '') +
      '<div class="row">' + (p.status === 'Proposed' ? '<button class="btn primary small" data-act="pverify" data-id="' + p.id + '">ยืนยันแล้ว</button>' : '') +
      '<button class="btn small" data-act="pedit" data-id="' + p.id + '">' + (p.status === 'Verified' ? 'แก้ไข (สร้างแถวใหม่)' : 'แก้ไข') + '</button>' +
      (p.status === 'Proposed' ? '<button class="btn danger small" data-act="pdel" data-id="' + p.id + '">เอาออก</button>' : '') + '</div></div>';
  }
  function viewProgress() {
    var open = S.tasks.filter(isOpen);
    var prop = S.progress.filter(function (p) { return p.status === 'Proposed'; }).length;
    var live = S.progress.filter(function (p) { return p.status !== 'Superseded'; });
    var h = '<div class="stack"><div class="stats">' +
      '<div class="stat"><b>' + open.length + '</b><span>งานค้าง</span></div>' +
      '<div class="stat' + (open.filter(isOverdue).length ? ' hot' : '') + '"><b>' + open.filter(isOverdue).length + '</b><span>เลยกำหนด</span></div>' +
      '<div class="stat"><b>' + open.filter(function (t) { return t.blocked || t.status === 'Waiting'; }).length + '</b><span>ติดขัด / รอคนอื่น</span></div>' +
      '<div class="stat"><b>' + prop + '</b><span>รอผู้จัดการยืนยัน</span></div></div>' +
      '<div class="row"><button class="btn primary" data-act="padd">+ เพิ่มความคืบหน้า</button><span class="note">ภาพรวมคือ "สถานะที่ยืนยันล่าสุด" ไม่ใช่ข้อมูลสดแบบ real-time</span></div>' + pform();
    S.lines.forEach(function (ln) {
      var ps = live.filter(function (p) { return p.line === ln; });
      if (!ps.length) return;
      h += '<div class="stack"><div class="line-h">' + esc(ln) + '</div>' + ps.map(pcard).join('') + '</div>';
    });
    var other = live.filter(function (p) { return S.lines.indexOf(p.line) < 0; });
    if (other.length) h += '<div class="stack"><div class="line-h">สายงานอื่น</div>' + other.map(pcard).join('') + '</div>';
    if (!live.length) h += '<p class="empty">ยังไม่มีความคืบหน้า กด "เพิ่มความคืบหน้า"</p>';
    var old = S.progress.filter(function (p) { return p.status === 'Superseded'; });
    if (old.length) h += '<details class="card"><summary>แถวที่ถูกแทนที่แล้ว (' + old.length + ')</summary><div class="stack" style="margin-top:10px">' + old.map(function (p) { return '<div class="note">' + esc(p.line) + ' · ' + esc(p.area) + ' · ' + esc(p.result) + ' (ณ ' + esc(fmt(p.asOf)) + ')</div>'; }).join('') + '</div></details>';
    return h + '</div>';
  }

  /* ---------- settings ---------- */
  function listEditor(key, title, hint) {
    return '<section class="card"><div class="sec-h"><h2>' + title + '</h2><span class="count">' + S[key].length + '</span></div><p class="note">' + hint + '</p>' +
      '<div class="chips">' + S[key].map(function (x, i) { return '<span class="chip">' + (key === 'areas' ? areaDot(x) : '') + esc(x) + '<button data-act="rmitem" data-key="' + key + '" data-i="' + i + '" aria-label="เอา ' + esc(x) + ' ออก">×</button></span>'; }).join('') + '</div>' +
      '<div class="row"><input class="grow" type="text" id="add-' + key + '" placeholder="ชื่อที่จะเพิ่ม"><button class="btn" data-act="additem" data-key="' + key + '">เพิ่ม</button></div></section>';
  }
  function viewSettings() {
    return '<div class="stack">' +
      listEditor('owners', 'ผู้รับผิดชอบ', 'เพิ่มได้ทั้งบทบาท (เช่น "นักสังคม") หรือชื่อเล่นรายคน') +
      listEditor('lines', 'สายงาน', 'หลักสูตรหรืองานหลักที่ใช้จัดกลุ่มแผนและความคืบหน้า') +
      listEditor('areas', 'พื้นที่', 'อปท. ชุมชน หรือย่าน') +
      '<section class="card"><div class="sec-h"><h2>ข้อมูลกลาง</h2></div><p class="note">ข้อมูลทั้งหมดในหน้านี้บันทึกร่วมกันเมื่อเปิดผ่านลิงก์ที่มีฐานข้อมูลกลาง ห้ามใส่ข้อมูลจริงที่อ่อนไหว (ชื่อผู้รับบริการ ที่อยู่ ตัวเลขงบองค์กร หรือ transcript ดิบ)</p><div class="row">' +
      (ui.confirm === 'reset' ? '<button class="btn danger" data-act="reset">ยืนยันกลับเป็นข้อมูลตัวอย่าง</button><button class="btn ghost" data-act="noconfirm">ยกเลิก</button>' : '<button class="btn" data-act="askreset">กลับเป็นข้อมูลตัวอย่าง</button>') +
      (ui.confirm === 'wipe' ? '<button class="btn danger" data-act="wipe">ยืนยันล้างทั้งหมดและเริ่มว่าง</button><button class="btn ghost" data-act="noconfirm">ยกเลิก</button>' : '<button class="btn" data-act="askwipe">ล้างข้อมูลทั้งหมด</button>') +
      '</div></section>' +
      '<section class="card"><div class="sec-h"><h2>กติกา 7 ข้อ</h2></div><ol class="note" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">' +
      '<li>งานอยู่ในที่เดียว ไม่จดซ้ำในที่อื่น</li><li>ประชุมที่จัดจริงจดไว้ในแท็บประชุม ไม่ต้องสร้างล่วงหน้า</li><li>ความคืบหน้าที่ยืนยันแล้วห้ามแก้ทับ ให้สร้างแถวใหม่</li>' +
      '<li>ห้ามใส่ชื่อ/ที่อยู่ผู้รับบริการ ตัวเลขการเงินองค์กร หรือ transcript ดิบ</li><li>ตัวเลขทุกตัวต้องมี ณ วันที่และหลักฐาน</li><li>⚪ ไม่ทราบ ไม่เท่ากับ 🟢 ตามแผน</li><li>AI ร่าง คนยืนยัน</li></ol></section></div>';
  }

  /* ---------- render ---------- */
  function render() {
    ['overview', 'meet', 'tasks', 'settings'].forEach(function (t) { document.getElementById('tab-' + t).setAttribute('aria-selected', String(ui.tab === t)); });
    $v.className = ui.tab === 'overview' ? 'wide' : '';
    $v.innerHTML = ui.tab === 'overview' ? viewOverview() : ui.tab === 'meet' ? viewMeet() : ui.tab === 'tasks' ? viewTasks() : viewSettings();
    document.querySelectorAll('.bta').forEach(fit);
    if (ui.focus) { var el = document.getElementById(ui.focus); if (el) el.focus(); ui.focus = null; }
  }
  function fit(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  /* ---------- actions ---------- */
  function copy(text, okMsg) {
    var fail = function () { toast('คัดลอกอัตโนมัติไม่ได้ ให้เลือกข้อความแล้วคัดลอกเอง'); };
    try { navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fail); } catch (e) { fail(); }
  }
  function mainAct(a, b, id) {
    var t;
    if (a === 'tab') { ui.tab = b.dataset.tab; ui.confirm = null; render(); return; }
    if (a === 'done') { t = task(id); t.status = t.status === 'Done' ? 'Next' : 'Done'; save(); render(); return; }
    if (a === 'week') { t = task(id); t.week = !t.week; save(); render(); return; }
    if (a === 'open') { ui.open = ui.open === id ? null : id; ui.confirm = null; render(); return; }
    if (a === 'blocked') { ui.open = id; ui.focus = null; render(); var bi = document.querySelector('[data-t="' + id + '"][data-f="blocked"]'); if (bi) bi.focus(); return; }
    if (a === 'close') { ui.open = null; ui.confirm = null; render(); return; }
    if (a === 'askdelete') { ui.confirm = 'del-' + id; render(); return; }
    if (a === 'noconfirm') { ui.confirm = null; render(); return; }
    if (a === 'delete') { S.tasks = S.tasks.filter(function (x) { return x.id !== id; }); ui.open = null; ui.confirm = null; save(); render(); toast('ลบงานแล้ว'); return; }
    if (a === 'quickadd') { addTask(document.getElementById('quick').value); return; }
    if (a === 'copysum') { copy(summaryText(), 'คัดลอกสรุปงานรายคนแล้ว นำไปวางในกลุ่มทีมได้'); return; }
    if (a === 'padd') { ui.pform = { line: S.lines[0] || '', area: '', milestone: '', result: '', next: '', nextDate: '', rag: 'g', asOf: todayISO(), conf: 'ประเมิน', decide: false, replaces: null }; ui.progOpen = true; render(); return; }
    if (a === 'pedit') {
      var p = S.progress.filter(function (x) { return x.id === id; })[0];
      ui.pform = { line: p.line, area: p.area, milestone: p.milestone, result: p.result, next: p.next, nextDate: p.nextDate, rag: p.rag, asOf: todayISO(), conf: p.conf, decide: p.decide, replaces: p.status === 'Verified' ? p.id : null, editId: p.status === 'Proposed' ? p.id : null };
      ui.progOpen = true; render(); return;
    }
    if (a === 'pcancel') { ui.pform = null; render(); return; }
    if (a === 'psave') {
      var f = ui.pform;
      if (!f.line || !f.area) { toast('เลือกสายงานและพื้นที่ก่อน'); return; }
      if (checkMoney([f.result, f.next, f.milestone])) return;
      if (f.editId) { var q = S.progress.filter(function (x) { return x.id === f.editId; })[0]; ['line', 'area', 'milestone', 'result', 'next', 'nextDate', 'rag', 'asOf', 'conf', 'decide'].forEach(function (k) { q[k] = f[k]; }); }
      else S.progress.push({ id: uid(), line: f.line, area: f.area, milestone: f.milestone, result: f.result, next: f.next, nextDate: f.nextDate, rag: f.rag, asOf: f.asOf, conf: f.conf, decide: f.decide, status: 'Proposed', replaces: f.replaces });
      ui.pform = null; save(); render(); toast('บันทึกเป็น "รอยืนยัน" แล้ว กด "ยืนยันแล้ว" เมื่อที่ประชุมรับรอง'); return;
    }
    if (a === 'pverify') {
      var v = S.progress.filter(function (x) { return x.id === id; })[0]; v.status = 'Verified';
      if (v.replaces) S.progress.forEach(function (x) { if (x.id === v.replaces) x.status = 'Superseded'; });
      v.replaces = null; save(); render(); toast('ยืนยันแล้ว'); return;
    }
    if (a === 'pdel') { S.progress = S.progress.filter(function (x) { return x.id !== id; }); save(); render(); return; }
    if (a === 'additem') {
      var k = b.dataset.key, inp = document.getElementById('add-' + k), val = inp.value.trim();
      if (!val) return;
      if (S[k].indexOf(val) >= 0) { toast('มีชื่อนี้อยู่แล้ว'); return; }
      S[k].push(val); save(); ui.focus = 'add-' + k; render(); return;
    }
    if (a === 'rmitem') {
      var key = b.dataset.key, name = S[key][+b.dataset.i];
      var used = (key === 'owners' && S.tasks.some(function (x) { return x.owner === name; })) ||
        (key === 'lines' && (S.tasks.some(function (x) { return x.line === name; }) || S.progress.some(function (x) { return x.line === name; }) || S.board.groups.some(function (g) { return g.line === name; }) || S.meetings.some(function (m) { return m.line === name; }))) ||
        (key === 'areas' && (S.tasks.some(function (x) { return x.area === name; }) || S.progress.some(function (x) { return x.area === name; }) || S.board.groups.some(function (g) { return g.sections.some(function (x) { return x.area === name; }); }) || S.meetings.some(function (m) { return m.area === name; })));
      if (used) { toast('"' + name + '" ยังมีงาน ความคืบหน้า หรือแผนใช้อยู่ ย้ายหรือแก้ก่อน'); return; }
      S[key].splice(+b.dataset.i, 1); if (key === 'owners' && ui.owner === name) ui.owner = 'all'; save(); render(); return;
    }
    if (a === 'askreset') { ui.confirm = 'reset'; render(); return; }
    if (a === 'askwipe') { ui.confirm = 'wipe'; render(); return; }
    if (a === 'reset') { S = sample(); ui.confirm = null; ui.owner = 'all'; save(); render(); toast('กลับเป็นข้อมูลตัวอย่างแล้ว'); return; }
    if (a === 'wipe') { S.tasks = []; S.progress = []; S.meetings = []; S.board = { asOf: todayISO(), groups: [] }; ui.confirm = null; save(); render(); toast('ล้างข้อมูลแล้ว เริ่มจากว่าง'); return; }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act;
    if (boardAct(a, b)) return;
    if (meetAct(a, b)) return;
    mainAct(a, b, b.dataset.id);
  });

  /* ---------- fields ---------- */
  function fieldEvent(el, type) {
    var d = el.dataset;
    if (el.classList && el.classList.contains('bta') && type === 'input') fit(el);
    if (d.mi) { if (type === 'input') { var m = mOf(d.m), it = m && itOf(m, d.mi); if (it) { it.t = el.value; touch(m); save(); } } return true; }
    if (d.mk) { if (type === 'change') { var mm = mOf(d.m), ii = mm && itOf(mm, d.mk); if (ii) { ii.kind = el.value; touch(mm); save(); render(); } } return true; }
    if (d.mf) { meetField(el, type); return true; }
    if (d.bf) { if (d.bf === 'asof' && type === 'input') return true; boardField(el, el.type === 'checkbox' ? el.checked : el.value); return true; }
    if (d.t) { var tk = task(d.t); if (tk) { tk[d.f] = el.value; save(); } return true; }
    if (d.pf) { if (ui.pform) ui.pform[d.pf] = el.type === 'checkbox' ? el.checked : el.value; return true; }
    return false;
  }
  document.addEventListener('input', function (e) { fieldEvent(e.target, 'input'); });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.filter === 'owner') { ui.owner = el.value; render(); return; }
    if (el.dataset.filter === 'hide') { ui.hideDone = el.checked; render(); return; }
    fieldEvent(el, 'change');
  });
  function click(sel) { var b = document.querySelector(sel); if (b) b.click(); }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var el = e.target, id = el.id || '';
    if (el.classList && el.classList.contains('bta')) { e.preventDefault(); el.blur(); return; }
    if (id === 'quick') { e.preventDefault(); addTask(el.value); return; }
    if (id.indexOf('ns-') === 0) { e.preventDefault(); click('[data-act="addstep"][data-s="' + id.slice(3) + '"]'); return; }
    if (id.indexOf('mi-') === 0) { e.preventDefault(); click('[data-act="mitemadd"][data-m="' + id.slice(3) + '"]'); return; }
    if (id.indexOf('mn-') === 0 || id.indexOf('gn-') === 0) { e.preventDefault(); el.blur(); return; }
    if (id.indexOf('add-') === 0) { e.preventDefault(); click('[data-act="additem"][data-key="' + id.slice(4) + '"]'); }
  });
  document.addEventListener('toggle', function (e) { if (e.target.id === 'progdet') ui.progOpen = e.target.open; }, true);

  /* ---------- start ---------- */
  S = load();
  render();
  startDb();
})();
</script>
